services:
  - type: web
    name: be-todo
    env: docker
    rootDir: be
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString

  - type: web
    name: fe-todo
    env: docker
    rootDir: fe
    dockerfilePath: Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://be-todo.onrender.com

databases:
  - name: dpg-d7vkbrdckfvc73en2b20-a
    databaseName: db_todo_ppe8
    user: zhennue
    plan: free
